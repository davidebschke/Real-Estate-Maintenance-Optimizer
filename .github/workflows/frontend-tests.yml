name: Frontend Tests

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check which paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "frontend/**"
              - ".github/workflows/frontend-tests.yml"

  test:
    name: Run frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

  e2e:
    name: Run frontend e2e tests (Playwright)
    runs-on: ubuntu-latest
    env:
      # CI-only credentials for the throwaway database of this job; never used anywhere else
      E2E_PASSWORD: ci-only-e2e-password-not-a-secret
    services:
      # Matches the backend's local spring.datasource defaults (see backend/docker-compose.yml), so no extra env is needed
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: remo
          POSTGRES_USER: remo
          POSTGRES_PASSWORD: remo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remo -d remo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Start backend
        working-directory: backend
        env:
          REMO_FRONTEND_BASE_URL: http://localhost:4173
          REMO_AUTH_JWT_SECRET: ci-only-jwt-secret-for-the-throwaway-e2e-backend
          REMO_AUTH_INITIAL_USER_PASSWORD: ${{ env.E2E_PASSWORD }}
          # The preview server and backend run on plain http://localhost in CI
          REMO_AUTH_COOKIE_SECURE: "false"
          # Every browser project of every (retried) run creates demo accounts from the same runner address
          REMO_AUTH_MAX_DEMO_ACCOUNTS_PER_CLIENT: "100"
        run: |
          java -jar target/remo-backend.jar > backend.log 2>&1 &
          for i in $(seq 1 40); do
            curl --silent --fail http://localhost:8080/api/version && exit 0
            sleep 3
          done
          echo "Backend did not become ready in time, last log lines:" >&2
          tail -n 100 backend.log >&2
          exit 1

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
