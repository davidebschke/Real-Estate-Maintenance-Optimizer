name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-oracle-cloud.yml"

concurrency:
  group: oracle-cloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check backend database secrets
        env:
          REMO_DB_URL: ${{ secrets.REMO_DB_URL }}
          REMO_DB_USERNAME: ${{ secrets.REMO_DB_USERNAME }}
          REMO_DB_PASSWORD: ${{ secrets.REMO_DB_PASSWORD }}
        run: |
          if [ -z "$REMO_DB_URL" ] || [ -z "$REMO_DB_USERNAME" ] || [ -z "$REMO_DB_PASSWORD" ]; then
            echo "::error::REMO_DB_URL, REMO_DB_USERNAME and REMO_DB_PASSWORD secrets must all be set" >&2
            exit 1
          fi

      - name: Check backend authentication secrets
        env:
          REMO_AUTH_JWT_SECRET: ${{ secrets.REMO_AUTH_JWT_SECRET }}
          REMO_AUTH_INITIAL_USER_PASSWORD: ${{ secrets.REMO_AUTH_INITIAL_USER_PASSWORD }}
        run: |
          # The backend refuses to start with a shorter HMAC key, so fail before deploying instead of after the restart
          if [ "$(printf '%s' "$REMO_AUTH_JWT_SECRET" | wc -c)" -lt 32 ]; then
            echo "::error::REMO_AUTH_JWT_SECRET secret must be set to at least 32 bytes" >&2
            exit 1
          fi
          if [ -z "$REMO_AUTH_INITIAL_USER_PASSWORD" ]; then
            echo "::warning::REMO_AUTH_INITIAL_USER_PASSWORD is not set; the account_default account cannot log in until it has a password"
          fi

      - name: Check road routing secret
        env:
          REMO_ROUTING_API_KEY: ${{ secrets.REMO_ROUTING_API_KEY }}
        run: |
          if [ -z "$REMO_ROUTING_API_KEY" ]; then
            echo "::warning::REMO_ROUTING_API_KEY is not set; road routing stays disabled and the map keeps drawing straight lines"
          fi

      - name: Check AI optimization secret
        env:
          REMO_AI_API_KEY: ${{ secrets.REMO_AI_API_KEY }}
        run: |
          if [ -z "$REMO_AI_API_KEY" ]; then
            echo "::warning::REMO_AI_API_KEY is not set; the AI appointment optimization stays disabled"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up SSH access
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Write backend database and authentication configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_BACKEND_DEPLOY_PATH: ${{ secrets.ORACLE_BACKEND_DEPLOY_PATH }}
          REMO_DB_URL: ${{ secrets.REMO_DB_URL }}
          REMO_DB_USERNAME: ${{ secrets.REMO_DB_USERNAME }}
          REMO_DB_PASSWORD: ${{ secrets.REMO_DB_PASSWORD }}
          REMO_AUTH_JWT_SECRET: ${{ secrets.REMO_AUTH_JWT_SECRET }}
          REMO_AUTH_INITIAL_USER_PASSWORD: ${{ secrets.REMO_AUTH_INITIAL_USER_PASSWORD }}
          REMO_ROUTING_API_KEY: ${{ secrets.REMO_ROUTING_API_KEY }}
          REMO_AI_API_KEY: ${{ secrets.REMO_AI_API_KEY }}
          # Only set the repository variable to "false" while the site is still served over plain HTTP
          REMO_AUTH_COOKIE_SECURE: ${{ vars.REMO_AUTH_COOKIE_SECURE || 'true' }}
        run: |
          # systemd EnvironmentFile values are double-quoted with backslash/quote escaped, so any secret reaches the JVM unchanged
          env_line() { printf '%s="%s"\n' "$1" "$(printf '%s' "$2" | sed -e 's/[\\"]/\\&/g')"; }
          { env_line SPRING_DATASOURCE_URL "$REMO_DB_URL"
            env_line SPRING_DATASOURCE_USERNAME "$REMO_DB_USERNAME"
            env_line SPRING_DATASOURCE_PASSWORD "$REMO_DB_PASSWORD"
            env_line REMO_AUTH_JWT_SECRET "$REMO_AUTH_JWT_SECRET"
            env_line REMO_AUTH_INITIAL_USER_PASSWORD "$REMO_AUTH_INITIAL_USER_PASSWORD"
            env_line REMO_AUTH_COOKIE_SECURE "$REMO_AUTH_COOKIE_SECURE"
            env_line REMO_ROUTING_API_KEY "$REMO_ROUTING_API_KEY"
            env_line REMO_ROUTING_ENABLED "$([ -n "$REMO_ROUTING_API_KEY" ] && echo true || echo false)"
            env_line REMO_AI_API_KEY "$REMO_AI_API_KEY"
            env_line REMO_AI_ENABLED "$([ -n "$REMO_AI_API_KEY" ] && [ -n "$REMO_ROUTING_API_KEY" ] && echo true || echo false)"; } \
            | ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_SSH_PORT" "$ORACLE_SSH_USER@$ORACLE_HOST" \
              "umask 077 && cat > '$ORACLE_BACKEND_DEPLOY_PATH/backend.env.tmp' && chmod 600 '$ORACLE_BACKEND_DEPLOY_PATH/backend.env.tmp' && mv '$ORACLE_BACKEND_DEPLOY_PATH/backend.env.tmp' '$ORACLE_BACKEND_DEPLOY_PATH/backend.env'"

      - name: Deploy frontend build
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_FRONTEND_DEPLOY_PATH: ${{ secrets.ORACLE_FRONTEND_DEPLOY_PATH }}
        run: |
          rsync -avz --delete --no-owner --no-group --omit-dir-times --chmod=Dg+rwxs,Fg+rw -e "ssh -i ~/.ssh/oracle_deploy_key -p $ORACLE_SSH_PORT" \
            frontend/dist/ "$ORACLE_SSH_USER@$ORACLE_HOST:$ORACLE_FRONTEND_DEPLOY_PATH/"

      - name: Deploy backend jar
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_BACKEND_DEPLOY_PATH: ${{ secrets.ORACLE_BACKEND_DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/oracle_deploy_key -P "$ORACLE_SSH_PORT" \
            backend/target/remo-backend.jar "$ORACLE_SSH_USER@$ORACLE_HOST:$ORACLE_BACKEND_DEPLOY_PATH/remo-backend.jar"

      - name: Restart backend service
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_BACKEND_SERVICE_NAME: ${{ secrets.ORACLE_BACKEND_SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_SSH_PORT" "$ORACLE_SSH_USER@$ORACLE_HOST" \
            "sudo systemctl restart $ORACLE_BACKEND_SERVICE_NAME"

      - name: Verify backend is healthy after restart
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_SSH_PORT" "$ORACLE_SSH_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          for i in $(seq 1 20); do
            curl --silent --fail http://localhost:8080/api/version && exit 0
            sleep 3
          done
          echo "Backend did not become healthy after restart" >&2
          exit 1
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/oracle_deploy_key
