name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-oracle-cloud.yml"

concurrency:
  group: oracle-cloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up SSH access
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend build
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_FRONTEND_DEPLOY_PATH: ${{ secrets.ORACLE_FRONTEND_DEPLOY_PATH }}
        run: |
          rsync -avz --delete --no-owner --no-group --chmod=Dg+rwxs,Fg+rw -e "ssh -i ~/.ssh/oracle_deploy_key -p $ORACLE_SSH_PORT" \
            frontend/dist/ "$ORACLE_SSH_USER@$ORACLE_HOST:$ORACLE_FRONTEND_DEPLOY_PATH/"

      - name: Deploy backend jar
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_BACKEND_DEPLOY_PATH: ${{ secrets.ORACLE_BACKEND_DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/oracle_deploy_key -P "$ORACLE_SSH_PORT" \
            backend/target/remo-backend.jar "$ORACLE_SSH_USER@$ORACLE_HOST:$ORACLE_BACKEND_DEPLOY_PATH/remo-backend.jar"

      - name: Restart backend service
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_BACKEND_SERVICE_NAME: ${{ secrets.ORACLE_BACKEND_SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_SSH_PORT" "$ORACLE_SSH_USER@$ORACLE_HOST" \
            "sudo systemctl restart $ORACLE_BACKEND_SERVICE_NAME"

      - name: Verify backend is healthy after restart
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_SSH_PORT" "$ORACLE_SSH_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          for i in $(seq 1 20); do
            curl --silent --fail http://localhost:8080/api/version && exit 0
            sleep 3
          done
          echo "Backend did not become healthy after restart" >&2
          exit 1
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/oracle_deploy_key
