spring:
  application:
    name: real-estate-maintenance-optimizer
  config:
    # Local developer secrets (REMO_AUTH_*), never committed; production passes them as real environment variables instead
    import: optional:file:.env[.properties]
  autoconfigure:
    # Accounts live in the users table (see AuthService), so Spring Boot's generated in-memory default user must not exist
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  messages:
    basename: locales/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    # Local defaults match docker-compose.yml; production (Supabase) overrides them via SPRING_DATASOURCE_URL/USERNAME/PASSWORD
    url: jdbc:postgresql://localhost:5432/remo
    username: remo
    password: remo
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    properties:
      hibernate:
        "[default_schema]": remo
        "[default_batch_fetch_size]": 50
  flyway:
    # Dedicated schema instead of "public", which Supabase exposes through its auto-generated Data API
    schemas: remo

server:
  # Trusts X-Forwarded-For only from local/private reverse proxies, so rate limits see the real client address behind one
  forward-headers-strategy: native

remo:
  frontend:
    # Origin allowed to call the backend REST API (Vite dev server default port)
    base-url: http://localhost:5173
  auth:
    # HMAC key for the session JWT, at least 32 bytes; no default on purpose, startup fails without it
    jwt-secret: ${REMO_AUTH_JWT_SECRET:}
    session-duration: 8h
    # Must stay true wherever the app is served over HTTPS; only plain-HTTP local development may turn it off
    cookie-secure: ${REMO_AUTH_COOKIE_SECURE:true}
    # Sets the password of the "account_default" account on startup while it has none yet; never logged or stored in plain text
    initial-user-password: ${REMO_AUTH_INITIAL_USER_PASSWORD:}
    max-failed-logins-per-username-and-client: 5
    max-failed-logins-per-client: 20
    failed-login-window: 15m
    max-demo-accounts-per-client: ${REMO_AUTH_MAX_DEMO_ACCOUNTS_PER_CLIENT:10}
    demo-account-creation-window: 1h
    max-active-demo-accounts: 100
  appointments:
    # Minimum gap in minutes between two appointments of the same account (creation and rescheduling), e.g. for travel and tools
    buffer-minutes: 5
  routing:
    # Road routes via openrouteservice; while false the endpoint answers 501 and the frontend silently keeps drawing straight lines
    enabled: ${REMO_ROUTING_ENABLED:false}
    # api.openrouteservice.org is deprecated in favour of api.heigit.org (same API key); no trailing slash, otherwise requests fail with 405
    base-url: https://api.heigit.org/openrouteservice
    # Required (startup fails without it) while routing is enabled; never commit it
    api-key: ${REMO_ROUTING_API_KEY:}
    # Free plan allows 40 directions requests/minute and 2,000/day in total, so stay below that across all accounts and demo accounts
    max-requests-per-account-per-minute: 20
    max-requests-per-minute: 30
    max-requests-per-day: 1500
  ai:
    # AI appointment optimization via Claude (Anthropic API); while false the endpoint answers 501 and the frontend explains that the feature is off
    enabled: ${REMO_AI_ENABLED:false}
    # Required (startup fails without it) while the AI optimization is enabled; never commit it
    api-key: ${REMO_AI_API_KEY:}
    model: ${REMO_AI_MODEL:claude-haiku-4-5}
    timeout: 60s
    max-tokens: 4096
    max-runs-per-account-per-hour: 5
    max-runs-per-day: 200
  optimization:
    # Appointments closer than this many days stay untouched, the planner looks ahead up to the horizon
    min-lead-days: 28
    horizon-days: 365
    # A recurring occurrence moves at most this many days away from the date it was originally planned for
    max-recurring-shift-days: 14
    work-day-start: "07:00"
    work-day-end: "19:00"
    slot-minutes: 15
    min-saved-distance-meters: 500
    max-candidates-per-appointment: 3
    max-candidates-for-ai: 60
    # openrouteservice matrix requests allow at most 3,500 location pairs (59 locations) and 500 requests per day on the free plan
    max-matrix-locations: 50
    max-matrix-requests-per-day: 400
    zone: Europe/Berlin
