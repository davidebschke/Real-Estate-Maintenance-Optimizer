spring:
  application:
    name: real-estate-maintenance-optimizer
  messages:
    basename: locales/messages
    encoding: UTF-8
    fallback-to-system-locale: false

remo:
  frontend:
    # Origin allowed to call the backend REST API (Vite dev server default port)
    base-url: http://localhost:5173
  storage:
    # Folder (relative to the working directory) holding appointments as JSON files until a database replaces it
    directory: ExampleTerms
    properties:
      # Folder (relative to the working directory) holding properties as JSON files until a database replaces it
      directory: ExampleObjects
