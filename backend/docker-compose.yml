# Local development database; matches the spring.datasource defaults in src/main/resources/application.yml
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: remo
      POSTGRES_USER: remo
      POSTGRES_PASSWORD: remo
    ports:
      - "5432:5432"
    volumes:
      - remo-postgres-data:/var/lib/postgresql/data

volumes:
  remo-postgres-data:
